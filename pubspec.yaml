name: bible_study_app
description: "Universal Bible Study App with Red-Letter text and persistent offline study tools."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # High-performance local storage for persistent highlights, notes, history & questions
  shared_preferences: ^2.3.2
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  # Register the KJV dataset asset
  assets:
    - assets/kjv.json
    - assets/images/